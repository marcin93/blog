{% extends "base.html" %}

{% block title %} &ndash; {{ page.title|striptags|escape }}{% endblock %}

{% block content %}
<article class="page">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
  </header>
  <div class="page-content">
    {{ page.content }}
  </div>
</article>
{% endblock %}
