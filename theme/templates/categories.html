{% extends "base.html" %}

{% block title %} &ndash; Categories{% endblock %}

{% block content %}
<article class="page">
  <header class="page-header">
    <h1>Categories</h1>
  </header>
  <div class="post-list" style="padding: 0 2rem 2rem;">
    {% for category, articles in categories|sort %}
    <div class="post-card">
      <div class="post-card-content">
        <h3 class="post-card-title">
          <a href="{{ SITEURL }}/{{ category.url }}">{{ category }}</a>
        </h3>
        <p>{{ articles|count }} article{% if articles|count != 1 %}s{% endif %}</p>
      </div>
    </div>
    {% endfor %}
  </div>
</article>
{% endblock %}
